<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — StoryBurrow</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-body"><main class="auth-container"><div class="auth-card"><div class="auth-mark">✦</div><h1>Story<span>Burrow</span></h1><p class="intro">Your stories are waiting.</p>
{% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input id="username" name="username" required autocomplete="username" autofocus><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="play" type="submit">Enter the Burrow</button></form><p class="auth-foot">A little escape is just around the corner.</p></div></main></body></html>
