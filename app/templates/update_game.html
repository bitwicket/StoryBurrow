<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Update {{ game_id }} — StoryBurrow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit_game.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='update_game.css') }}">
</head>

<body>
    <header class="site-header">
        <div class="brand">Story<span>Burrow</span></div><span class="tagline">Your stories, one cozy place.</span>
    </header>
    <main class="sb-update-backdrop">
        <section class="sb-update-dialog">
            <div class="sb-update-heading">
                <div>
                    <p class="eyebrow">INSTALLATION MANAGEMENT</p>
                    <h1>Update {{ game_id }}</h1>
                </div><a class="sb-update-close" href="{{ url_for('edits.edit_game',game_id=game_id) }}" aria-label="Return to Edit Game">×</a>
            </div>{% include '_update_game_content.html' %}
        </section>
    </main>
    <script src="{{ url_for('static', filename='update_game.js') }}" defer></script>
</body>

</html>
